<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args && args.length > 0) {
            const msg = args.map(a => (a && (a.message || a.stack || String(a))) || '').join(' ');
            if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket')) {
              return;
            }
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args && args.length > 0) {
            const msg = args.map(a => (a && (a.message || a.stack || String(a))) || '').join(' ');
            if (msg.includes('[vite]') || msg.includes('autoSize') || msg.includes('WebSocket')) {
              return;
            }
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason ? String(event.reason.message || event.reason) : '';
          if (reason.toLowerCase().includes('websocket') || reason.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message ? String(event.message) : '';
          if (msg.toLowerCase().includes('websocket') || msg.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
